<text x="690" y="250" fill="#183642" font-size="20" font-weight="400" text-anchor="start">H取max(12,11)=12；L取max(8,9)=9</text>
<text x="690" y="292" fill="#546d76" font-size="18" font-weight="400" text-anchor="start">按时间顺序处理，不能跨根任意合并。</text>
