<text x="44" y="90" fill="#546d76" font-size="18" font-weight="400" text-anchor="start">A=[8,12]包含B=[9,11]；方向取自此前非包含关系。</text>
<text x="44" y="705" fill="#546d76" font-size="17" font-weight="400" text-anchor="start">自制教学示意 · 非真实行情 · 定义与前提见教程及原作者出处</text>
