<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img"><title>03  包含处理：相同输入，方向不同</title><desc>A=[8,12]包含B=[9,11]；方向取自此前非包含关系。</desc>
