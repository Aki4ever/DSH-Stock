<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img"><title>05  线段：特征序列无缺口的例子</title><desc>假定下图每一笔都已按笔规则独立确认；折点数字是价格。</desc>
<style>text{font-family:"PingFang SC","Heiti SC","STHeiti",sans-serif}</style>
<rect x="0" y="0" width="1200" height="880" rx="0" fill="#f7f6f0" stroke="none"/>
<text x="44" y="54" fill="#183642" font-size="32" font-weight="600" text-anchor="start">05  线段：特征序列无缺口的例子</text>
<text x="44" y="90" fill="#546d76" font-size="18" font-weight="400" text-anchor="start">假定下图每一笔都已按笔规则独立确认；折点数字是价格。</text>
<text x="44" y="855" fill="#546d76" font-size="17" font-weight="400" text-anchor="start">自制教学示意 · 非真实行情 · 定义与前提见教程及原作者出处</text>
<rect x="44" y="134" width="725" height="365" rx="14" fill="white" stroke="#ccd9db"/>
<polyline points="110,415 201,265 292,355 383,205 474,295 565,235 656,385" fill="none" stroke="#546d76" stroke-width="3" stroke-dasharray="" stroke-linejoin="round"/>
<circle cx="110" cy="415" r="5" fill="#087f8c"/>
<text x="103" y="400" fill="#183642" font-size="20" font-weight="400" text-anchor="start">5</text>
<circle cx="201" cy="265" r="5" fill="#087f8c"/>
<text x="194" y="250" fill="#183642" font-size="20" font-weight="400" text-anchor="start">10</text>
