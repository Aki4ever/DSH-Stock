<text x="634" y="660" fill="#183642" font-size="18" font-weight="400" text-anchor="start">底组K1—K3 / 顶组K3—K5：共用K3。</text>
<text x="44" y="752" fill="#bc5a2e" font-size="19" font-weight="400" text-anchor="start">“至少五根”必须说明计数对象；不能直接数原始K线，不能遗漏分型的左右元素。</text></svg>