<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>R01 行情股东修复 · 实时进度</title><style>body{font:16px/1.7 system-ui;background:#101827;color:#eef2ff;max-width:950px;margin:40px auto;padding:20px}article{border:1px solid #3b4b68;border-radius:12px;padding:16px;margin:12px 0}progress{width:100%;height:16px}small{color:#aab9d2}.current{border-color:#64bfff}h1{margin-bottom:6px}</style><h1>R01 行情股东修复</h1><p id="status">读取状态中…</p><div id="stages"></div><p id="value"></p><small id="note"></small><script>async function load(){try{const r=await fetch('progress.json',{cache:'no-store'});if(!r.ok)throw Error('状态读取失败');const p=await r.json();document.getElementById('status').textContent=`${p.focus} · 难度 ${p.difficulty}/100 · 整体 ${p.overall}% · 更新 ${p.updated_at}`;const root=document.getElementById('stages');root.replaceChildren();for(const s of p.stages){const a=document.createElement('article');a.className=s.id===p.current?'current':'';const h=document.createElement('strong');h.textContent=`${s.name} · ${s.status} · ${s.percent}%`;const bar=document.createElement('progress');bar.max=100;bar.value=s.percent;const info=document.createElement('p');info.textContent=s.evidence;const next=document.createElement('small');next.textContent=`下一步：${s.next}`;a.append(h,bar,info,next);root.append(a)}document.getElementById('value').textContent=p.value;document.getElementById('note').textContent=p.note}catch(e){document.getElementById('status').textContent='进度面板失联，请以任务消息中的最近验证状态为准。'}}load();setInterval(load,3000)</script></html>
